<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School Bus Live Tracker</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />

<style>
  * { box-sizing: border-box; }
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f8;
  }
  header {
    background: #1e3a8a;
    color: white;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  header h1 { font-size: 18px; margin: 0; }
  #map { height: calc(100vh - 130px); width: 100%; }
  .info-bar {
    background: white;
    padding: 12px 20px;
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    font-size: 14px;
    border-bottom: 1px solid #e2e8f0;
  }
  .info-item { display: flex; flex-direction: column; }
  .info-item span.label { color: #64748b; font-size: 12px; }
  .info-item span.value { font-weight: bold; color: #1e293b; }
  select {
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #cbd5e1;
    font-size: 14px;
  }
  .bus-emoji-icon {
    font-size: 26px;
    text-align: center;
  }
</style>
</head>
<body>

<header>
  <h1>🚌 School Bus Live Tracker</h1>
  <select id="busSelect" onchange="switchBus()">
    <option value="BUS01">BUS01</option>
  </select>
</header>

<div class="info-bar">
  <div class="info-item">
    <span class="label">Status</span>
    <span class="value" id="statusVal">Waiting for data...</span>
  </div>
  <div class="info-item">
    <span class="label">Last Updated</span>
    <span class="value" id="timeVal">--</span>
  </div>
  <div class="info-item">
    <span class="label">Speed</span>
    <span class="value" id="speedVal">--</span>
  </div>
</div>

<div id="map"></div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Firebase compat build served from jsdelivr (gstatic blocked in this environment) -->
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-database-compat.js"></script>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyAVa0W9QRk2p_YugfM4GBoodxEpax2AqaA",
    authDomain: "school-bus-tracker-63ce2.firebaseapp.com",
    databaseURL: "https://school-bus-tracker-63ce2-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "school-bus-tracker-63ce2",
    storageBucket: "school-bus-tracker-63ce2.firebasestorage.app",
    messagingSenderId: "1036649845223",
    appId: "1:1036649845223:web:1349c2566f717ecc04ad42"
  };

  var db = null;
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  } catch (e) {
    document.getElementById('statusVal').innerText = "Firebase load error: " + e.message;
  }

  var map = L.map('map').setView([19.0760, 72.8777], 13);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  var busIcon = L.divIcon({
    html: '🚌',
    className: 'bus-emoji-icon',
    iconSize: [30, 30]
  });

  var marker = null;
  var currentBusId = "BUS01";
  var firstUpdate = true;

  function listenToBus(busId) {
    if (!db) return;
    db.ref('buses/' + busId).on('value', function (snapshot) {
      var data = snapshot.val();
      if (!data) {
        document.getElementById('statusVal').innerText = "No data yet";
        return;
      }

      var lat = data.lat;
      var lng = data.lng;
      var speed = data.speed || 0;
      var lastUpdated = data.lastUpdated;

      if (!marker) {
        marker = L.marker([lat, lng], { icon: busIcon }).addTo(map);
      } else {
        marker.setLatLng([lat, lng]);
      }

      if (firstUpdate) {
        map.setView([lat, lng], 15);
        firstUpdate = false;
      }

      document.getElementById('statusVal').innerText = "🟢 Live";
      document.getElementById('timeVal').innerText = new Date(lastUpdated).toLocaleTimeString();
      document.getElementById('speedVal').innerText = (speed * 3.6).toFixed(1) + " km/h";
    }, function (error) {
      document.getElementById('statusVal').innerText = "Firebase error: " + error.message;
    });
  }

  function switchBus() {
    var select = document.getElementById('busSelect');
    var newBusId = select.value;
    if (currentBusId && db) {
      db.ref('buses/' + currentBusId).off();
    }
    if (marker) {
      map.removeLayer(marker);
      marker = null;
    }
    firstUpdate = true;
    currentBusId = newBusId;
    listenToBus(newBusId);
  }

  listenToBus(currentBusId);
</script>

</body>
</html>
